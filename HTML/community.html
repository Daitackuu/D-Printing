<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community — D'Printing</title>
<link rel="icon" type="image/png" href="../Resources/Images/Web-Logo.png">
<link rel="apple-touch-icon" href="../Resources/Images/Web-Logo.png">
<link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-col">
      <div class="topbar-mini" id="topbarMini"></div>

      <div class="wrap">
        <div class="comm-hero">
          <span class="comm-hero-hash" aria-hidden="true">#</span>
          <div class="comm-hero-text">
            <p class="eyebrow">Komunitas</p>
            <h1>Channel D'Printing</h1>
            <p class="sub">Gabung ke channel yang ada, atau buat channel baru buat ngobrol bareng.</p>
          </div>
          <div class="comm-hero-side">
            <div class="comm-hero-stat"><span id="channelTotal">0</span><small>channel</small></div>
            <button class="comm-hero-btn" id="createChannelBtn"><span class="icon-img" role="img" aria-label="Buat" style="--icon:url('../Resources/Icons/Plus-Dark.png')"></span> Buat channel</button>
          </div>
        </div>

        <div class="comm-toolbar">
          <div class="comm-search">
            <svg class="comm-search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input type="text" id="channelSearch" placeholder="Cari channel…" autocomplete="off">
          </div>
          <!-- Dropdown urutan (custom-select dari app.js) — diisi community.js -->
          <div id="channelSortWrap" class="comm-sort-wrap"></div>
        </div>
        <p class="comm-result-note" id="channelResultNote"></p>

        <div id="channelList" class="channel-grid"><div class="skeleton-list" aria-busy="true" aria-label="Memuat"><div class="skeleton-row"><div class="skeleton-col"><span class="skeleton sk-title"></span><span class="skeleton sk-line"></span></div><span class="skeleton sk-pill"></span></div><div class="skeleton-row"><div class="skeleton-col"><span class="skeleton sk-title"></span><span class="skeleton sk-line"></span></div><span class="skeleton sk-pill"></span></div><div class="skeleton-row"><div class="skeleton-col"><span class="skeleton sk-title"></span><span class="skeleton sk-line"></span></div><span class="skeleton sk-pill"></span></div></div></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="createChannelModal">
    <div class="modal-box">
      <div class="modal-hero-icon" aria-hidden="true">#</div>
      <h3>Buat channel baru</h3>
      <p class="sub" style="margin:-4px 0 12px;">Kasih nama yang jelas biar gampang ditemukan.</p>
      <label for="channelNameInput">Nama channel</label>
      <input type="text" id="channelNameInput" placeholder="mis. Tips Print Hemat">
      <label for="channelDescInput">Deskripsi (opsional)</label>
      <input type="text" id="channelDescInput" placeholder="Ngobrolin apa di sini?">
      <div class="error-msg" id="createChannelErr"></div>
      <div class="modal-actions" style="margin-top:16px;">
        <button class="btn btn-outline" id="createChannelCancel">Batal</button>
        <button class="btn btn-primary" id="createChannelSubmit">Buat</button>
      </div>
    </div>
  </div>

  <script type="module" src="../JS/community.js"></script>
</body>
</html>
